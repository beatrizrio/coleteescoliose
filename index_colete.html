<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Monitor de Pressão — Colete Ortopédico</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F3F6F5;
    --surface: #FFFFFF;
    --surface-alt: #EAF0EE;
    --ink: #1B2624;
    --ink-muted: #5C6B69;
    --teal: #1E6E62;
    --teal-deep: #14504A;
    --teal-soft: #D8ECE7;
    --safe: #4C9A72;
    --warn: #D98E3B;
    --danger: #C1443C;
    --line: #D8E2DF;
    --radius: 16px;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Inter', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .mono { font-family: 'JetBrains Mono', monospace; }

  .app {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    padding: 20px 24px 12px;
  }

  /* ---------- Topbar ---------- */
  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px;
    padding-bottom: 16px;
    border-bottom: 1px solid var(--line);
  }

  .brand .eyebrow {
    display: block;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--teal);
    margin-bottom: 2px;
  }

  .brand h1 {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 600;
    font-size: clamp(20px, 2.4vw, 26px);
    margin: 0;
    color: var(--ink);
  }

  .controls { display: flex; gap: 10px; flex-wrap: wrap; }

  .btn {
    font-family: 'Inter', sans-serif;
    font-weight: 600;
    font-size: 15px;
    border-radius: 12px;
    padding: 14px 20px;
    border: 1.5px solid transparent;
    cursor: pointer;
    transition: transform 0.08s ease, background 0.15s ease, border-color 0.15s ease;
    min-height: 48px;
  }
  .btn:active { transform: scale(0.97); }
  .btn:focus-visible { outline: 3px solid var(--teal); outline-offset: 2px; }

  .btn.primary { background: var(--teal); color: #fff; }
  .btn.primary:hover { background: var(--teal-deep); }
  .btn.primary.connected { background: var(--danger); }

  .btn.ghost { background: transparent; border-color: var(--line); color: var(--ink-muted); }
  .btn.ghost.active { background: var(--surface-alt); border-color: var(--teal); color: var(--teal-deep); }

  .btn.outline { background: var(--surface); border-color: var(--line); color: var(--teal-deep); }
  .btn.outline:hover { border-color: var(--teal); }
  .btn.full { width: 100%; }

  /* ---------- Grid ---------- */
  .grid {
    flex: 1;
    display: grid;
    grid-template-columns: minmax(280px, 1fr) minmax(320px, 1.1fr);
    gap: 20px;
    margin-top: 20px;
  }
  @media (max-width: 820px) {
    .grid { grid-template-columns: 1fr; }
  }

  .card {
    background: var(--surface);
    border-radius: var(--radius);
    border: 1px solid var(--line);
    padding: 24px;
  }

  /* ---------- Gauge card ---------- */
  .gauge-card {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 18px;
  }

  .silhouette-wrap { width: 64px; }
  .silhouette { width: 64px; height: 108px; }
  .silhouette-outline { fill: none; stroke: var(--ink-muted); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
  .sensor-dot {
    transition: fill 0.3s ease;
  }
  .sensor-dot.pulse { animation: pulse 1.4s ease-in-out infinite; }
  @keyframes pulse {
    0%, 100% { r: 6; opacity: 1; }
    50% { r: 9; opacity: 0.65; }
  }
  @media (prefers-reduced-motion: reduce) {
    .sensor-dot.pulse { animation: none; }
  }

  .gauge-wrap { position: relative; width: 220px; height: 220px; }
  .gauge { width: 100%; height: 100%; transform: rotate(-90deg); }
  .gauge-track { fill: none; stroke: var(--surface-alt); stroke-width: 16; }
  .gauge-progress {
    fill: none;
    stroke: var(--teal);
    stroke-width: 16;
    stroke-linecap: round;
    transition: stroke-dashoffset 0.25s ease, stroke 0.25s ease;
  }
  .gauge-center {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }
  .reading {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    font-size: 52px;
    line-height: 1;
    color: var(--ink);
  }
  .unit {
    font-family: 'JetBrains Mono', monospace;
    font-size: 14px;
    color: var(--ink-muted);
    margin-top: 4px;
  }

  .status-row {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    color: var(--ink-muted);
  }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--ink-muted); flex-shrink: 0; }
  .dot.offline { background: #B7C2C0; }
  .dot.online { background: var(--safe); }
  .dot.sim { background: var(--warn); }
  #lastUpdate { margin-left: 6px; }

  /* ---------- Side card ---------- */
  .side-card { display: flex; flex-direction: column; gap: 22px; }

  .stats-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
  }
  .stat {
    background: var(--surface-alt);
    border-radius: 12px;
    padding: 12px 10px;
    display: flex;
    flex-direction: column;
    gap: 4px;
    align-items: center;
  }
  .stat-label { font-size: 11px; color: var(--ink-muted); text-transform: uppercase; letter-spacing: 0.04em; }
  .stat-value { font-size: 18px; font-weight: 600; color: var(--ink); }

  .chart-block { flex: 1; display: flex; flex-direction: column; gap: 8px; min-height: 140px; }
  .chart-header { font-size: 13px; color: var(--ink-muted); font-weight: 600; }
  #sparkline { width: 100%; height: 100%; min-height: 120px; background: var(--surface-alt); border-radius: 12px; }

  .footer {
    text-align: center;
    font-size: 12px;
    color: var(--ink-muted);
    padding: 16px 0 4px;
  }

  /* Touch target comfort on tablet */
  button, input { touch-action: manipulation; }
</style>
</head>
<body>
<div class="app">

  <header class="topbar">
    <div class="brand">
      <span class="eyebrow">Laboratorio Ortorio </span>
      <h1>Monitor de Pressão — Colete Ortopédico</h1>
    </div>
    <div class="controls">
      <button id="btnSim" class="btn ghost">Modo simulação</button>
      <button id="btnConnect" class="btn primary">Conectar sensor</button>
    </div>
  </header>

  <main class="grid">
    <section class="card gauge-card">
      <div class="silhouette-wrap">
        <svg class="silhouette" viewBox="0 0 60 100" aria-hidden="true">
          <path class="silhouette-outline" d="M20 6 C20 2, 40 2, 40 6 L40 16 C40 20, 44 22, 46 28 L48 46 C49 50, 46 52, 43 51 L40 44 L40 90 C40 94, 36 96, 32 94 L30 60 L28 94 C24 96, 20 94, 20 90 L20 44 L17 51 C14 52, 11 50, 12 46 L14 28 C16 22, 20 20, 20 16 Z"/>
          <circle id="sensorDot" class="sensor-dot" cx="30" cy="34" r="6" fill="#B7C2C0"/>
        </svg>
      </div>

      <div class="gauge-wrap">
        <svg class="gauge" viewBox="0 0 200 200">
          <circle class="gauge-track" cx="100" cy="100" r="84"/>
          <circle id="gaugeProgress" class="gauge-progress" cx="100" cy="100" r="84"
                  stroke-dasharray="527.8" stroke-dashoffset="527.8"/>
        </svg>
        <div class="gauge-center">
          <span id="reading" class="reading" aria-live="polite">--</span>
          <span class="unit">kPa</span>
        </div>
      </div>

      <div class="status-row">
        <span id="statusDot" class="dot offline"></span>
        <span id="statusText">Desconectado</span>
        <span id="lastUpdate" class="mono"></span>
      </div>
    </section>

    <section class="card side-card">
      <div class="stats-grid">
        <div class="stat"><span class="stat-label">Mínimo</span><span id="statMin" class="stat-value mono">--</span></div>
        <div class="stat"><span class="stat-label">Médio</span><span id="statAvg" class="stat-value mono">--</span></div>
        <div class="stat"><span class="stat-label">Máximo</span><span id="statMax" class="stat-value mono">--</span></div>
      </div>

      <div class="chart-block">
        <div class="chart-header">Histórico (últimos 60 s)</div>
        <svg id="sparkline" viewBox="0 0 400 140" preserveAspectRatio="none" aria-hidden="true"></svg>
      </div>

      <button id="btnExport" class="btn outline full">Exportar sessão (CSV)</button>
    </section>
  </main>

  <footer class="footer">
    Palmilha &amp; Colete Inteligente — Laboratório Ortorio
  </footer>
</div>

<script>
(function () {
  "use strict";

  // ---------- Elements ----------
  const btnConnect = document.getElementById('btnConnect');
  const btnSim = document.getElementById('btnSim');
  const btnExport = document.getElementById('btnExport');
  const reading = document.getElementById('reading');
  const statusDot = document.getElementById('statusDot');
  const statusText = document.getElementById('statusText');
  const lastUpdate = document.getElementById('lastUpdate');
  const gaugeProgress = document.getElementById('gaugeProgress');
  const statMin = document.getElementById('statMin');
  const statAvg = document.getElementById('statAvg');
  const statMax = document.getElementById('statMax');
  const sparkline = document.getElementById('sparkline');
  const sensorDot = document.getElementById('sensorDot');

  const GAUGE_CIRCUMFERENCE = 2 * Math.PI * 84; // ~527.8

  // ---------- State ----------
  let port = null;
  let reader = null;
  let readLoopActive = false;
  let simTimer = null;
  let simulating = false;
  let readings = []; // {t: ms, v: kPa}
  let sessionLog = []; // full history for export
  let lineBuffer = '';
  let peakSeen = 30; // used to auto-scale the gauge/chart as readings come in

  // ---------- Helpers ----------
  function setStatus(state) {
    statusDot.classList.remove('online', 'offline', 'sim');
    if (state === 'online') {
      statusDot.classList.add('online');
      statusText.textContent = 'Conectado (sensor real)';
    } else if (state === 'sim') {
      statusDot.classList.add('sim');
      statusText.textContent = 'Simulação ativa';
    } else {
      statusDot.classList.add('offline');
      statusText.textContent = 'Desconectado';
    }
  }

  // ---------- Core reading handler ----------
  function handleReading(value) {
    const now = Date.now();
    reading.textContent = value.toFixed(1);
    lastUpdate.textContent = new Date(now).toLocaleTimeString('pt-BR');

    peakSeen = Math.max(peakSeen, value * 1.15);
    const ratio = Math.min(value / peakSeen, 1);
    const offset = GAUGE_CIRCUMFERENCE * (1 - ratio);
    gaugeProgress.style.strokeDashoffset = offset.toFixed(2);
    sensorDot.setAttribute('fill', '#1E6E62');

    readings.push({ t: now, v: value });
    sessionLog.push({ t: now, v: value });
    const cutoff = now - 60000;
    readings = readings.filter(r => r.t >= cutoff);

    updateStats();
    updateChart();
  }

  function updateStats() {
    if (readings.length === 0) return;
    const values = readings.map(r => r.v);
    const min = Math.min(...values);
    const max = Math.max(...values);
    const avg = values.reduce((a, b) => a + b, 0) / values.length;
    statMin.textContent = min.toFixed(1);
    statAvg.textContent = avg.toFixed(1);
    statMax.textContent = max.toFixed(1);
  }

  function updateChart() {
    if (readings.length < 2) { sparkline.innerHTML = ''; return; }
    const now = Date.now();
    const windowMs = 60000;

    const points = readings.map(r => {
      const x = 400 - ((now - r.t) / windowMs) * 400;
      const y = 140 - Math.min(r.v / peakSeen, 1) * 132 - 4;
      return `${x.toFixed(1)},${y.toFixed(1)}`;
    }).join(' ');

    sparkline.innerHTML = `
      <polyline points="${points}" fill="none" stroke="#1E6E62" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    `;
  }

  // ---------- Web Serial ----------
  async function connectSerial() {
    if (!('serial' in navigator)) {
      alert('Web Serial não é suportado neste navegador/dispositivo. Use Chrome ou Edge em um computador ou tablet Windows/ChromeOS.');
      return;
    }
    if (simulating) stopSimulation();

    try {
      port = await navigator.serial.requestPort();
      await port.open({ baudRate: 9600 });
      readLoopActive = true;
      btnConnect.textContent = 'Desconectar';
      btnConnect.classList.add('connected');
      setStatus('online');
      readLoop();
    } catch (err) {
      console.error(err);
      setStatus('offline');
    }
  }

  async function readLoop() {
    const decoder = new TextDecoderStream();
    const inputDone = port.readable.pipeTo(decoder.writable);
    reader = decoder.readable.getReader();

    try {
      while (readLoopActive) {
        const { value, done } = await reader.read();
        if (done) break;
        if (value) {
          lineBuffer += value;
          let idx;
          while ((idx = lineBuffer.indexOf('\n')) >= 0) {
            const line = lineBuffer.slice(0, idx).trim();
            lineBuffer = lineBuffer.slice(idx + 1);
            parseLine(line);
          }
        }
      }
    } catch (err) {
      console.error('Erro na leitura serial:', err);
    } finally {
      reader.releaseLock();
      try { await inputDone.catch(() => {}); } catch (e) {}
    }
  }

  function parseLine(line) {
    // Espera algo como: "Pressao FSR: 12.34 kPa"
    const match = line.match(/([\d]+\.?[\d]*)\s*kPa/i);
    if (match) {
      const value = parseFloat(match[1]);
      if (!isNaN(value)) handleReading(value);
    }
  }

  async function disconnectSerial() {
    readLoopActive = false;
    try {
      if (reader) await reader.cancel();
    } catch (e) { /* ignore */ }
    try {
      if (port) await port.close();
    } catch (e) { /* ignore */ }
    port = null;
    btnConnect.textContent = 'Conectar sensor';
    btnConnect.classList.remove('connected');
    setStatus('offline');
  }

  btnConnect.addEventListener('click', () => {
    if (btnConnect.classList.contains('connected')) {
      disconnectSerial();
    } else {
      connectSerial();
    }
  });

  // ---------- Simulation mode ----------
  function startSimulation() {
    simulating = true;
    btnSim.classList.add('active');
    btnSim.textContent = 'Parar simulação';
    setStatus('sim');
    let t = 0;
    simTimer = setInterval(() => {
      t += 0.2;
      const base = 25 + 20 * Math.sin(t / 3);
      const noise = (Math.random() - 0.5) * 6;
      const spike = Math.random() < 0.03 ? 25 : 0;
      const value = Math.max(0, base + noise + spike);
      handleReading(value);
    }, 200);
  }

  function stopSimulation() {
    simulating = false;
    btnSim.classList.remove('active');
    btnSim.textContent = 'Modo simulação';
    clearInterval(simTimer);
    if (!port) setStatus('offline');
  }

  btnSim.addEventListener('click', () => {
    if (simulating) stopSimulation();
    else startSimulation();
  });

  // ---------- Export CSV ----------
  btnExport.addEventListener('click', () => {
    if (sessionLog.length === 0) {
      alert('Nenhum dado registrado ainda nesta sessão.');
      return;
    }
    let csv = 'timestamp_iso,pressao_kPa\n';
    sessionLog.forEach(r => {
      csv += `${new Date(r.t).toISOString()},${r.v.toFixed(2)}\n`;
    });
    const blob = new Blob([csv], { type: 'text/csv' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `sessao_colete_${new Date().toISOString().slice(0,19).replace(/[:T]/g,'-')}.csv`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  });

  // ---------- Init ----------
  setStatus('offline');
})();
</script>
</body>
</html>
